# Contrat de capability — rag-embeddings (C4)
# Embeddings gemini-embedding-001 (768d figé — D5) via Gemini API stdlib.

id: rag-embeddings
version: 0.1.0
title: "RAG — embeddings des contenus indexés"
type: mix
description: >
  Génère les vecteurs 768d (gemini-embedding-001, Gemini) des contenus à
  indexer (contenu nouveau des mails, OCR des PJ). L'upsert en RAG passe
  par les RPC génériques C5 (rpc_cap_doc_upsert). Modèle FIGÉ (D5) :
  changer = réindexer tout le RAG.

secrets: [VPS_GEMINI_API_KEY]

env:
  EMBED_MODEL: "gemini-embedding-001"
  EMBED_MAX_CHARS: "6000"

mcp: []
skills: [rag-embed]
routines: []
code: [embed_gemini]

mounts: {}

soul_addendum: soul-addendum.md
tests: tests/
