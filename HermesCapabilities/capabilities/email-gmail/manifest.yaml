# Contrat de capability — email-gmail (C1, M2.1-bis IMAP)
id: email-gmail
version: 0.2.0
title: "Email — réception IMAP par alias client"
type: mix
description: >
  Lecture des emails pro via IMAP app password (boîte contrôlée), filtre
  strict sur l'alias client (+AREV), export spool threads + PJ, marquage
  'traite' par déplacement vers label (COPY + \Deleted + UID EXPUNGE).
  Lecture EXAMINE + BODY.PEEK (zéro mutation en lecture).

# Secrets requis dans HermesConfig/clients/<slug>/client.env (600)
# GMAIL_RECEPTION_IMAP_ADRESS : adresse de la boîte (ex: REDACTED_EMAIL)
# GMAIL_RECEPTION_IMAP_MDP    : app password IMAP (2FA Gmail requise)
# (orthographe 'ADRESS' conservée — convention existante du propriétaire)
secrets: [GMAIL_RECEPTION_IMAP_ADRESS, GMAIL_RECEPTION_IMAP_MDP]

env:
  GMAIL_ALIAS_TAG: "+AREV"
  GMAIL_LABEL_DONE: "ia-traite"
  GMAIL_MAX_THREADS: "5"
  GMAIL_SPOOL_DIR: "/opt/data/spool/gmail"
  GMAIL_NEWER_THAN_DAYS: "90"

mcp: []
skills: [gmail-poll]

# Routine créée à M2.6 (pipeline complet attaché)
routines: [email-poll]

code: [imap_poll, imap_mark_done]

mounts: {}

soul_addendum: soul-addendum.md
tests: tests/
