# Routines cron de la capability email-gmail

# La routine complète est créée à M2.6 (pipeline complet attaché). Le prompt
# sera enrichi avec le chainage complet (C2→C6). Le poller seul ci-dessous
# est le squelette de référence.

routines:
  - id: email-poll
    schedule: "*/10 8-19 * * *"      # heures creuses 20h→08h (D1)
    profile: ops                     # routines appartiennent au bot Ops (D11 HermesConfig)
    prompt: >-
      Pipeline email : exécuter python3 /opt/data/code/email-gmail/imap_poll.py
      (résumé stdout + spool). Pour chaque thread du spool
      (<spool>/threads/<tid>/thread.json), suivre PIPELINE_EMAIL_AREV.md §2
      (thread-parser, classification, OCR PJ, embeddings, RAG upsert,
      expert-router, expert-facturation), puis marquer traité:
      python3 /opt/data/code/email-gmail/imap_mark_done.py <uids>.
      Terminer par rpc_cap_pipeline_log (compteurs du run).
      Max 5 threads par run. Silencieux (aucune notification).
