# ⚠️ FICHIER GÉNÉRÉ — NE PAS ÉDITER À LA MAIN
# Source de vérité : HermesCapabilities/sql/generic/*.sql (D9)
#   + Alinea/openapi/openapi.config.ts (exposition + opérations)
# Régénération : `pnpm gen:openapi` · Vérification : `pnpm gen:check`
openapi: 3.1.0
info:
  title: Alinea API
  version: 0.1.0
  description: "API du backoffice clients PME (HermesFleet). Données : projet Supabase multi-tenant
    (tables cap_*, slug = client). Auth : session Supabase. GÉNÉRÉ depuis
    HermesCapabilities/sql/generic — ne pas éditer le YAML."
servers:
  - url: /
    description: Same-origin (front + API, 1 service)
tags:
  - name: auth
  - name: factures
  - name: emails
  - name: documents
  - name: runs
  - name: files
  - name: admin
paths:
  /api/v1/me:
    get:
      operationId: getMe
      tags:
        - auth
      summary: "Utilisateur connecté : rôle + client"
      responses:
        "200":
          description: "Utilisateur connecté : rôle + client"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Requête invalide (validation OpenAPI)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/factures:
    get:
      operationId: listFactures
      tags:
        - factures
      summary: Liste paginée des factures du client
      parameters:
        - name: statut
          in: query
          required: false
          schema:
            type: string
            enum:
              - extracted
              - valide
              - rejete
              - paye
              - archive
          description: Filtre par statut.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Taille de page (max 200).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Offset de pagination.
      responses:
        "200":
          description: Liste paginée des factures du client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactureList"
        "400":
          description: Requête invalide (validation OpenAPI)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/factures/{id}:
    get:
      operationId: getFacture
      tags:
        - factures
      summary: Détail d'une facture
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Détail d'une facture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facture"
        "400":
          description: Requête invalide (validation OpenAPI)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Ressource introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateFacture
      tags:
        - factures
      summary: Transition de statut (validation humaine)
      description: "D6 : la validation humaine = transition de statut. extracted → valide | rejete ;
        rejets/validations ultérieurs conformes aux CHECK SQL."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactureUpdate"
      responses:
        "200":
          description: Transition de statut (validation humaine)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facture"
        "400":
          description: Requête invalide (validation OpenAPI)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Ressource introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/emails:
    get:
      operationId: listEmails
      tags:
        - emails
      summary: Liste paginée des emails traités
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - received
              - processed
              - error
          description: Filtre par statut de traitement.
        - name: thread_id
          in: query
          required: false
          schema:
            type: string
          description: Filtre par chaîne (X-GM-THRID).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Taille de page (max 200).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Offset de pagination.
      responses:
        "200":
          description: Liste paginée des emails traités
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailList"
        "400":
          description: Requête invalide (validation OpenAPI)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/emails/{id}:
