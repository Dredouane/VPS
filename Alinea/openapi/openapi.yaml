            - "null"
        date_facture:
          type:
            - string
            - "null"
          format: date
        date_echeance:
          type:
            - string
            - "null"
          format: date
        montant_ht:
          type:
            - number
            - "null"
        montant_tva:
          type:
            - number
            - "null"
        montant_ttc:
          type:
            - number
            - "null"
        devise:
          type: string
        statut:
          type: string
          enum:
            - extracted
            - valide
            - rejete
            - paye
            - archive
        confiance:
          type:
            - number
            - "null"
        email_message_id:
          type:
            - string
            - "null"
        document_id:
          type:
            - string
            - "null"
          format: uuid
        extraction: {}
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
