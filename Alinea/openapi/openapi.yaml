      summary: Détail d'un email
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Détail d'un email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"
        "400":
          description: Requête invalide (validation OpenAPI)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Ressource introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/chains:
    get:
      operationId: listChains
      tags:
        - emails
      summary: Liste paginée des chaînes (threads Gmail)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Taille de page (max 200).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Offset de pagination.
      responses:
        "200":
          description: Liste paginée des chaînes (threads Gmail)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChainList"
        "400":
          description: Requête invalide (validation OpenAPI)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/chains/{threadId}:
    get:
      operationId: getChainDetail
      tags:
        - emails
      summary: Détail d'une chaîne (vue gmail-like composite)
      description: "Shape suggéré par WEBAPP_DATA_MAPPING.md §5 : chaîne + mails chronologiques
        (mail_date) avec contenu et PJ (parent_message_id) + factures liées (email_message_id ∈
        mails)."
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            description: X-GM-THRID Gmail.
      responses:
        "200":
          description: Détail d'une chaîne (vue gmail-like composite)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainDetail"
        "400":
          description: Requête invalide (validation OpenAPI)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Ressource introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/documents:
    get:
      operationId: listDocuments
      tags:
        - documents
      summary: Liste paginée des documents indexés
      parameters:
        - name: thread_id
          in: query
          required: false
          schema:
            type: string
          description: Filtre par thread Gmail.
        - name: message_id
          in: query
          required: false
          schema:
            type: string
          description: Filtre par mail (contenu kind=email de ce message_id).
        - name: parent_message_id
          in: query
          required: false
          schema:
            type: string
          description: Filtre les PJ portées par ce mail.
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum:
              - email
              - attachment
          description: Filtre par type de document.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Taille de page (max 200).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Offset de pagination.
      responses:
        "200":
          description: Liste paginée des documents indexés
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
        "400":
          description: Requête invalide (validation OpenAPI)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/documents/search:
    post:
      operationId: searchDocuments
      tags:
        - documents
      summary: Recherche sémantique RAG
      description: Embedding de la requête (text-embedding-004, 768d — D5) côté serveur puis
        rpc_cap_doc_search. similarité = 1 - distance cosinus.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentSearchRequest"
      responses:
        "201":
          description: Recherche sémantique RAG
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSearchResults"
        "400":
          description: Requête invalide (validation OpenAPI)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/runs:
