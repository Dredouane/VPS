                $ref: "#/components/schemas/Error"
        "404":
          description: Ressource introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/admin/clients:
    get:
      operationId: listClients
      tags:
